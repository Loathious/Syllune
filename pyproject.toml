[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syllune"
version = "0.24.1"
description = "Syllune: local dictation, a floating voice pill, and private meeting notes."
readme = "README.md"
# Proprietary: free to use for now, all other rights reserved. Code that came
# from the MIT-licensed projects Syllune grew out of is listed in the notices.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Loathious", email = "78258757+Loathious@users.noreply.github.com"}
]
keywords = [
    "dictation", "speech-to-text", "whisper", "voice-typing",
    "transcription", "ai-dictation", "local-ai", "offline",
    "push-to-talk", "voice-recognition", "accessibility",
    "faster-whisper", "privacy", "self-hosted", "syllune",
    "ollama", "voice-commands", "windows", "macos"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    # Cross-platform
    "faster-whisper>=1.2.1",
    "ctranslate2==4.7.1",
    "numpy>=1.24.0",
    "soxr>=0.3.0",
    "sherpa-onnx>=1.11.3",
    "sounddevice>=0.4.6",
    "pyperclip>=1.8.2",
    "ruamel.yaml>=0.18.14",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "hf-xet>=1.1.5",
    "playsound3>=2.0",
    "ten-vad>=1.0.6",

    # Windows-only
    "global-hotkeys>=0.1.7; sys_platform=='win32'",
    "pywin32>=306; sys_platform=='win32'",
    "soundcard==0.4.6; sys_platform=='win32'",
    # Media session control: pause/resume music while recording
    "winrt-runtime==3.2.1; sys_platform=='win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform=='win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform=='win32'",
    "winrt-Windows.Media.Control==3.2.1; sys_platform=='win32'",

    # macOS-only
    "pyobjc-framework-Quartz; sys_platform=='darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform=='darwin'",
]

[project.optional-dependencies]
# Opt-in whisper.cpp backend (set `whisper.backend: whisper_cpp` in user_settings.yaml)
# Models auto-download from huggingface.co/ggerganov/whisper.cpp on first use.
whispercpp = ["pywhispercpp>=1.2"]

# Spectral noise suppression via noisereduce (set `audio.noise_suppression.enabled: true`)
noise = ["noisereduce>=3.0.0"]

# System-audio (loopback) capture — transcribe what you hear (meetings, videos)
# via `syllune --transcribe-system`. Windows/macOS. EXPERIMENTAL.
loopback = ["soundcard>=0.4.2"]

[project.scripts]
syllune = "syllune.main:main"

[project.urls]
Homepage = "https://github.com/Loathious/Syllune"
Issues = "https://github.com/Loathious/Syllune/issues"
Changelog = "https://github.com/Loathious/Syllune/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"syllune" = ["assets/**/*", "platform/*/assets/*", "config.defaults.yaml", "commands.defaults.yaml", "profiles.defaults.yaml", "app_rules.defaults.yaml", "transforms.defaults.yaml", "release.json"]
