name: 🐛 Bug report
description: Something isn't working the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please search [existing issues](https://github.com/Loathious/Syllune/issues?q=is%3Aissue) first in case it's already known.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: "I held Ctrl+Win in Notepad and talked, but no text appeared..."
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Notepad
        2. Hold Ctrl+Win and say "hello world"
        3. Let go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Syllune version
      description: Settings → Check now shows it, and so does the installer's file name.
      placeholder: "0.24.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Right-click the Syllune tray icon, choose Help → Save logs for a bug report, and drag the zip in here.
        Personal paths are removed from it, but please look it over before attaching.
