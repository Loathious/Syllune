<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Syllune</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .accessible {position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; pointer-events:none}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Syllune dictation"></canvas>
<div class="accessible" id="status" role="status" aria-live="polite"></div>
<div class="accessible" id="actions"></div>
<script src="dock-geometry.js"></script>
<script>
// pill.html
// The dictation pill: a sliver tucked against the screen edge that comes out
// as a small handle when the cursor is near, opens into three icons on hover,
// and grows into a capsule with one thin voice line while you talk (upright
// on the side docks). It becomes a ball under the cursor while dragged, shows
// a travelling glint while the text is prepared, and can ask one short
// question ("Paste dictation?"). One canvas; every geometric property is a
// spring, so any state can interrupt any other mid-motion. When nothing moves
// the frame loop stops, so the resting pill costs nothing.

// --- Motion -------------------------------------------------------------------

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

// A damped spring set with Apple-style parameters: perceived duration in
// seconds and bounce (0 = no overshoot).
class Spring {
  constructor(value, duration, bounce = 0) {
    this.x = value; this.v = 0; this.target = value;
    this.configure(duration, bounce);
  }
  configure(duration, bounce = 0) {
    this.k = (2 * Math.PI / duration) ** 2;
    this.c = 4 * Math.PI * (1 - bounce) / duration;
  }
  step(dt) {
    this.v += (-this.k * (this.x - this.target) - this.c * this.v) * dt;
    this.x += this.v * dt;
  }
  get resting() { return Math.abs(this.x - this.target) < 0.01 && Math.abs(this.v) < 0.05; }
  // Jump straight to a value, as if it had always been there.
  set(value) { this.x = value; this.v = 0; }
}

// Sizes settle without overshoot: a calm pill grows, it doesn't wobble.
const S = {
  w: new Spring(34, 0.3),
  h: new Spring(5, 0.3),
  gap: new Spring(9, 0.36),          // distance from the screen edge: small while tucked away
  dx: new Spring(0, 0.16),           // offset to the point it was grabbed at, while dragged
  dy: new Spring(0, 0.16),
  alpha: new Spring(0, 0.24),
  rise: new Spring(8, 0.4),          // offset toward the screen edge while hidden
  shake: new Spring(0, 0.3, 0.3),    // one soft sideways nudge on errors
  press: new Spring(1, 0.16),        // scale while pressed, or while leaving a dock
  body: new Spring(0.56, 0.26),      // glass opacity: the resting pill is quieter
  span: new Spring(32, 0.32),        // length of the voice line: shorter while working
  meter: new Spring(0, 0.22),        // layer opacities (timing set per direction below)
  work: new Spring(0, 0.36),         // 0 = voice line, 1 = working glint
  check: new Spring(0, 0.22),
  text: new Spring(0, 0.22),
  controls: new Spring(0, 0.22),
  offer: new Spring(0, 0.22),
  note: new Spring(0, 0.3),          // tint blend for note recordings
  meeting: new Spring(0, 0.22),
  mstop: new Spring(0, 0.18),
  icons: new Spring(0, 0.18),
};
const ALPHA_S = 0.24, ALPHA_LEAVE_S = 0.12;

// Content layers leave faster than they arrive, so the outgoing content is
// gone before the incoming content becomes legible: two layers never read at
// once in the middle of a morph.
const LAYERS = ['meter', 'check', 'text', 'controls', 'offer', 'meeting', 'mstop', 'icons'];
const CENTER_LAYERS = ['meter', 'check', 'text', 'offer', 'meeting', 'icons'];
const LAYER_ENTER_S = 0.22, LAYER_EXIT_S = 0.1;
const leaving = (name) => S[name].target < S[name].x;
function timeLayers() {
  for (const name of LAYERS) S[name].configure(leaving(name) ? LAYER_EXIT_S : LAYER_ENTER_S);
}

// Opacity of a centre layer after the handover: one arriving stays hidden
// until whatever is leaving that spot is all but gone (its own spring keeps
// running meanwhile, so it still lands on time). No frame shows both.
function centerOpacity(name) {
  const own = Math.min(1, Math.max(0, S[name].x));
  if (leaving(name)) return own;
  const outgoing = Math.max(0, ...CENTER_LAYERS.filter(leaving).map((n) => Math.min(1, S[n].x)));
  return own * (1 - smoothstep(0.02, 0.15, outgoing));
}

// Reduced motion keeps fades and size changes but drops slides, shakes and
// the moving voice line; main.js also stops gliding the window.
function applyReducedMotion() { window.bridge.setReducedMotion(reducedMotion.matches); }
reducedMotion.addEventListener('change', applyReducedMotion);
applyReducedMotion();

const easeOut = DockGeometry.easeOut;
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const smoothstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

// --- Look ---------------------------------------------------------------------
// Smoked glass with no colour of its own: it takes its tone from whatever is
// behind it, so it sits on any desktop without looking like a sticker.

const INK = [240, 240, 244];         // lines, icons and text
const GLASS_TOP = [60, 60, 66];      // the body, lighter where light would fall on it
const GLASS_BOTTOM = [20, 20, 24];
const HANDLE_TINT = [150, 150, 158];  // the resting line: a mid grey shows on light and dark desktops alike
const VIOLET = [196, 181, 253];      // note recordings
const GREEN = [134, 239, 172];
const STOP_RED = [248, 113, 113];
const ERROR_TEXT = [254, 202, 202];  // soft: most "errors" are just "didn't catch that"
const AMBER = [253, 224, 150];
const FONT = '500 12px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif';
const QUIET_NOTICE = 'Not hearing anything';
const QUIET_AFTER_MS = 5000;         // silence at the start of a recording before the quiet notice

// How the resting pill sits at its edge. Tucked away it is a sliver you can
// ignore; with the cursor near it is a handle; hovered it opens.
const EDGE_GAP = DockGeometry.EDGE_GAP; // shared with the dock previews
const SLIVER = { w: 20, h: 3, gap: 2, body: 0.4 };
const HANDLE = { w: 34, h: 5, gap: 9, body: 0.62 };
const OPEN_GAP = 14, OPEN_H = 28, OPEN_BODY = 0.6, ACTIVE_BODY = 0.7, TEXT_BODY = 0.8;
const TUCK_AFTER_MS = 3500;          // left alone this long, the handle tucks away

const ACTIVE_H = DockGeometry.ACTIVE_THICKNESS;
const LISTEN_W = DockGeometry.ACTIVE_LENGTH, LOCKED_W = 104, WORKING_W = 44, ROUND_W = ACTIVE_H;
const CONTROL_INSET = 16;            // hands-free stop and cancel, from each end
const BALL = 22;                     // size while dragged
// The hovered resting pill: hands-free dictation, start meeting, menu.
const ICON_SLOTS = [['handsfree', 20], ['meetingStart', 48], ['hub', 76]];
const ICONS_W = 96;
const MAX_W = DockGeometry.WINDOW_WIDTH - 2 * EDGE_GAP;
const BAND_COUNT = 6;
const LISTEN_SPAN = 32, WORKING_SPAN = 22;
const GLINT_MS = 1150;
const CHECK_DRAW_MS = 260;
const CHECK_DELAY_MS = 70;           // let the glint clear before the stroke starts

const mixColor = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// --- State --------------------------------------------------------------------

let mode = 'rest';                   // rest | listen | processing | success | saved | error
let noteMode = false, locked = false;
let message = '', messageAccent = VIOLET, calmError = false;
let noticeText = '', noticeUntil = 0;
let idlePill = true, gameMode = false;
let dock = null;                     // the edge the pill rests on, one of DockGeometry.POSITIONS
let dockLeaving = false, dockLeftSent = false;
let meetingSince = null, meetingTick = null;
let offer = null, offerLabel = '', offerTimer = null;   // the question the pill is asking, if any
let grab = null, dragStart = null, dragging = false;    // grab: where on the pill the press landed
// pointerInside is main.js's verdict and decides what a click hits; hovering
// is what the pill shows, and follows it with a short intent delay.
let pointerInside = false, hovering = false, hoverIntent = null;
let near = false;                    // the cursor is close enough to bring the pill out
let lastActiveAt = performance.now(), tuckTimer = null;
let mouse = null, hoverTarget = null, pressedOn = null;
let workSince = 0, checkSince = 0, lastHeardAt = 0, heardThisRecording = false;
let restTimer = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sideDock = () => dock === 'middle-left' || dock === 'middle-right';

const widthCache = new Map();
function textWidth(t) {
  if (!widthCache.has(t)) { ctx.font = FONT; widthCache.set(t, ctx.measureText(t).width); }
  return widthCache.get(t);
}
// Pill width for a label plus its padding (and checkmark), capped to the window.
const labelWidth = (label, extra) => Math.min(MAX_W, textWidth(label) + extra);

function setMode(next) {
  clearTimeout(restTimer);
  mode = next;
  const now = performance.now();
  if (next !== 'listen') noticeText = '';
  if (next === 'processing') workSince = now;
  if (next === 'listen') lastHeardAt = now;
  if (next === 'success' || next === 'saved') checkSince = now + CHECK_DELAY_MS;
  touch();
  wake();
}

function restAfter(ms) {
  clearTimeout(restTimer);
  restTimer = setTimeout(() => setMode('rest'), ms);
}

// Something just happened at the pill: it stays out as a handle for a while
// before tucking away again.
function touch() {
  lastActiveAt = performance.now();
  clearTimeout(tuckTimer);
  tuckTimer = setTimeout(wake, TUCK_AFTER_MS + 30);
}

// --- Geometry -----------------------------------------------------------------
// The pill grows away from its edge: up from the bottom, inward from a side.
// With the full edge gap its centre matches DockGeometry.dockBounds, so the
// recording pill lands exactly on the preview it was dropped on. The pill
// never travels inside its window (main.js moves the window instead), except
// that a dragged pill slides to the point it was grabbed at.

function dockCenter(w, h, gap) {
  const fit = (size, room) => Math.min(gap, Math.max(0, room - size));
  if (dock === 'middle-left') return { x: fit(w, innerWidth) + w / 2, y: innerHeight / 2 };
  if (dock === 'middle-right') return { x: innerWidth - fit(w, innerWidth) - w / 2, y: innerHeight / 2 };
  return { x: innerWidth / 2, y: innerHeight - fit(h, innerHeight) - h / 2 };
}

// Where the pill is drawn this frame, in window coordinates.
const drawnCenter = () => {
  const c = dockCenter(S.w.x, S.h.x, S.gap.x);
  return { x: c.x + S.dx.x, y: c.y + S.dy.x };
};

// Unit vector pointing at the screen edge: hidden pills sit a little past it.
function towardEdge() {
  if (dock === 'middle-left') return { x: -1, y: 0 };
  if (dock === 'middle-right') return { x: 1, y: 0 };
  return { x: 0, y: 1 };
}

// The resting shape lies along its edge, so it stands upright on a side dock.
function restShape(now) {
  const shape = near || now - lastActiveAt < TUCK_AFTER_MS ? HANDLE : SLIVER;
  return sideDock() ? { ...shape, w: shape.h, h: shape.w } : { ...shape };
}

// --- Voice --------------------------------------------------------------------
// The engine sends each band's loudness in dB. They are scaled against a
// loudness reference that follows your voice (fast up, slow down), so a quiet
// mic still moves the line, and a gate on the overall level keeps it flat
// while you're silent. The line itself is a few sine waves, one per pair of
// bands, that drift at their own speeds: it shows that you are being heard,
// not a spectrum to read.

const RANGE_DB = 34;
const WAVES = [
  { cycles: 1.0, speed: 3.4, weight: 0.5 },    // low bands: one slow swell
  { cycles: 1.9, speed: -5.2, weight: 0.32 },  // middle bands
  { cycles: 3.1, speed: 7.9, weight: 0.2 },    // high bands: a fine ripple
];
const LINE_POINTS = 44;
const voice = {
  bandsDb: null,
  rms: 0,
  referenceDb: -30,                  // kept between recordings: the next one starts calibrated
  shown: new Float32Array(BAND_COUNT),
  phase: WAVES.map((_, k) => k * 2.1),
};

function updateVoice(dt) {
  const bands = mode === 'listen' ? voice.bandsDb : null;
  let gate = 0;
  if (bands) {
    const peak = Math.max(...bands);
    if (peak > voice.referenceDb) voice.referenceDb += (peak - voice.referenceDb) * Math.min(1, dt * 10);
    else voice.referenceDb -= Math.min(voice.referenceDb - peak, 3 * dt);
    voice.referenceDb = clamp(voice.referenceDb, -50, -14);
    gate = smoothstep(0.0025, 0.007, voice.rms);
    if (voice.rms > 0.006) { lastHeardAt = performance.now(); heardThisRecording = true; }
  }
  const floor = voice.referenceDb - RANGE_DB;
  for (let i = 0; i < BAND_COUNT; i++) {
    const target = bands ? gate * clamp((bands[i] - floor) / RANGE_DB) ** 1.5 : 0;
    // Meter ballistics: rise in ~35 ms, fall in ~120 ms.
    const tau = target > voice.shown[i] ? 0.04 : 0.16;
    voice.shown[i] += (target - voice.shown[i]) * (1 - Math.exp(-dt / tau));
  }
  if (!reducedMotion.matches) WAVES.forEach((wave, k) => { voice.phase[k] += wave.speed * dt; });
}

// --- Engine messages ----------------------------------------------------------

window.bridge.onState((msg) => {
  switch (msg.state) {
    case 'recording':
      noteMode = !!msg.note; locked = false; message = '';
      voice.bandsDb = null; voice.rms = 0; voice.shown.fill(0);
      heardThisRecording = false;
      setMode('listen');
      break;
    case 'locked': locked = !!msg.value; wake(); break;
    case 'processing': setMode('processing'); break;
    case 'success':
      // A plain success is a checkmark; one with a word ("Copied") says what happened.
      if (msg.message) { message = String(msg.message); messageAccent = GREEN; setMode('saved'); restAfter(1300); }
      else { setMode('success'); restAfter(620); }
      break;
    case 'note_saved':
      message = 'Note saved'; messageAccent = VIOLET; setMode('saved'); restAfter(1500); break;
    case 'meeting_ready':
      if (mode !== 'listen' && mode !== 'processing') {
        message = 'Meeting notes ready'; messageAccent = VIOLET; setMode('saved'); restAfter(1500);
      }
      break;
    case 'error':
      // `calm` is news rather than a failure ("Restarting Syllune"): no shake, no red.
      message = msg.message || 'Something went wrong';
      calmError = !!msg.calm;
      setMode('error');
      if (!calmError && !reducedMotion.matches) S.shake.v -= 70;
      restAfter(calmError ? 3400 : 2600);
      break;
    case 'notice':
      noticeText = msg.message || ''; noticeUntil = performance.now() + 2800;
      wake();
      setTimeout(wake, 2810);
      break;
    case 'hidden': setMode('rest'); break;
  }
});

window.bridge.onLevel((level) => {
  voice.rms = level.v || 0;
  voice.bandsDb = Array.isArray(level.bands) && level.bands.length === BAND_COUNT ? level.bands : null;
});

window.bridge.onConfig((config) => {
  if ('idlePill' in config) idlePill = config.idlePill;
  if ('gameMode' in config) gameMode = config.gameMode;
  if ('meetingSince' in config) meetingSince = config.meetingSince;
  if (DockGeometry.POSITIONS.includes(config.dock) && config.dock !== dock) {
    const first = dock === null;
    dock = config.dock;
    lastHitKey = '';
    // The first dock is where the page starts: take its shape without a morph.
    if (first) { const t = layout(performance.now()); S.w.set(t.w); S.h.set(t.h); S.gap.set(t.gap); }
  }
  if (config.arrive) arrive();
  clearTimeout(meetingTick);
  wake();
});

// One short question at a time, with a time limit: "Paste dictation?" after
// a dictation found no text field, "Use as prompt" once the structured
// version of what you just dictated is ready. A null kind withdraws it.
window.bridge.onOffer((next) => {
  clearTimeout(offerTimer);
  const seconds = Number(next && next.seconds);
  offer = next && next.kind && next.label && seconds > 0 ? { kind: next.kind, label: String(next.label) } : null;
  if (offer) {
    offerLabel = offer.label;
    offerTimer = setTimeout(() => { offer = null; touch(); wake(); }, seconds * 1000);
  }
  touch();
  wake();
});

// --- Changing docks -----------------------------------------------------------
// main.js glides the window toward the dock you dropped the pill on while the
// pill fades and shrinks into it; once it reports the pill gone, the window
// jumps to the new edge and the pill appears there in its final shape, just
// past the edge, and settles in. Nothing visible ever moves inside the window
// while the window itself moves, so the two can't drift apart on screen.

window.bridge.onDockLeave(() => {
  dockLeaving = true; dockLeftSent = false;
  wake();
});

function arrive() {
  dockLeaving = false; dockLeftSent = false;
  touch();
  const t = layout(performance.now());
  S.w.set(t.w); S.h.set(t.h); S.gap.set(t.gap); S.dx.set(0); S.dy.set(0);
  S.alpha.set(0); S.press.set(1); S.shake.set(0);
  S.rise.set(reducedMotion.matches ? 0 : 8);
  wake();
}

// --- Pointer ------------------------------------------------------------------
// The window only receives the mouse while main.js sees the cursor over the
// pill (see reportHitRect below); clicks never take focus from your app.

const HOVER_ENTER_MS = 70;           // a cursor passing by doesn't open the pill
const HOVER_LEAVE_MS = 280;          // nor does one that slips off for a moment close it
const DRAG_AFTER_PX = 6;             // less movement than this is a click with a shaky hand
const FIXED_CONTROLS = ['stop', 'cancel', 'meetingStop'];   // these only ever click

window.bridge.onHover((inside) => {
  pointerInside = inside;
  if (!inside && !dragging) { mouse = null; hoverTarget = null; pressedOn = null; }
  clearTimeout(hoverIntent);
  if (inside !== hovering) {
    hoverIntent = setTimeout(() => { hovering = inside; touch(); wake(); }, inside ? HOVER_ENTER_MS : HOVER_LEAVE_MS);
  }
  wake();
});

window.bridge.onNear((value) => {
  near = !!value;
  touch();
  wake();
});

canvas.addEventListener('mousemove', (e) => { mouse = { x: e.clientX, y: e.clientY }; wake(); });
canvas.addEventListener('mouseleave', () => { mouse = null; wake(); });
canvas.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || dockLeaving) return;
  mouse = { x: event.clientX, y: event.clientY };
  hoverTarget = findHoverTarget(layout(performance.now()));
  pressedOn = hoverTarget;
  // Anything but the stop and cancel buttons can be dragged: the icons too,
  // since a press only becomes a click if the pointer stays put.
  if (pressedOn && !FIXED_CONTROLS.includes(pressedOn)) {
    grab = { x: event.clientX, y: event.clientY };
    dragStart = { x: event.screenX, y: event.screenY };
    canvas.setPointerCapture?.(event.pointerId);
  }
  wake();
});
canvas.addEventListener('pointermove', (event) => {
  mouse = { x: event.clientX, y: event.clientY };
  if (!dragStart) return;
  if (!dragging && Math.hypot(event.screenX - dragStart.x, event.screenY - dragStart.y) > DRAG_AFTER_PX) {
    dragging = true;
    wake();
  }
  // main.js puts the window under the cursor, keeping the grabbed point in the hand.
  if (dragging) window.bridge.pillDrag(grab);
});
canvas.addEventListener('pointerup', (event) => {
  mouse = { x: event.clientX, y: event.clientY };
  hoverTarget = findHoverTarget(layout(performance.now()));
  const released = pressedOn;
  const wasDragging = dragging;
  // Main aims the drop glide from where the pill is drawn.
  if (wasDragging) window.bridge.pillDragEnd(drawnCenter());
  dragging = false; dragStart = grab = null;
  if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  pressedOn = null;
  if (!wasDragging && released && released === hoverTarget) {
    const action = ACTIONS[released];
    if (action) window.bridge.pillAction(action);
    // Answered: the question folds away at once, the engine reports the rest.
    if (released === 'offer') { clearTimeout(offerTimer); offer = null; }
  }
  touch();
  wake();
});

// Interrupted capture must never leave previews or a pressed control behind.
function cancelDrag(notify = true) {
  if (notify && dragging) window.bridge.pillDragCancel();
  dragging = false; dragStart = grab = null;
  pressedOn = null;
  wake();
}
canvas.addEventListener('pointercancel', () => cancelDrag());
canvas.addEventListener('lostpointercapture', () => { if (dragStart) cancelDrag(); });
addEventListener('blur', () => cancelDrag());
addEventListener('pagehide', () => cancelDrag());
addEventListener('keydown', event => { if (event.key === 'Escape' && dragStart) cancelDrag(); });
window.bridge.onDragCancelled(() => cancelDrag(false));

// --- Layout -------------------------------------------------------------------

const ACTIONS = { pill: 'dictate', handsfree: 'dictate', meetingStart: 'meeting_start', stop: 'stop', cancel: 'cancel',
  meeting: 'meeting_open', meetingStop: 'meeting_stop', hub: 'open_hub', offer: 'offer_accept' };
const offerVisible = () => !!offer && !gameMode;
const meetingVisible = () => meetingSince !== null && !gameMode;
const restVisible = () => (idlePill || meetingSince !== null || !!offer) && !gameMode;
// Fixed templates prevent the capsule from moving sideways every second.
function meetingClock() {
  const seconds = Math.max(0, Math.floor((Date.now() - meetingSince) / 1000));
  const minutes = Math.floor(seconds / 60);
  return minutes >= 60 ? `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`
    : `${minutes}:${String(seconds % 60).padStart(2, '0')}`;
}

// What the pill should look like right now; the springs chase these values.
function layout(now) {
  // "Not hearing anything" is for a microphone that never produced a sound.
  // Once you have spoken, a pause is you thinking, and the pill just waits.
  const quiet = mode === 'listen' && !heardThisRecording && now - lastHeardAt > QUIET_AFTER_MS;
  const noticeShown = noticeText && now < noticeUntil;
  const notice = mode === 'listen' && (noticeShown || quiet);
  const noticeLabel = noticeShown ? noticeText : QUIET_NOTICE;
  const active = { h: ACTIVE_H, alpha: 1, rise: 0, body: ACTIVE_BODY, gap: EDGE_GAP };
  const shown = restVisible();
  const t = {
    ...restShape(now), alpha: shown ? 1 : 0, rise: shown ? 0 : 8,
    span: S.span.target, work: S.work.target, dx: 0, dy: 0,
    meter: 0, check: 0, text: 0, controls: 0, offer: 0, meeting: 0, mstop: 0, icons: 0,
    label: '', labelColor: null, notice,
  };
  switch (mode) {
    case 'rest':
      if (!shown) break;
      if (offerVisible()) Object.assign(t, {
        w: labelWidth(offer.label, 30), h: ACTIVE_H, gap: OPEN_GAP, body: ACTIVE_BODY, offer: 1,
      });
      else if (meetingVisible()) Object.assign(t, {
        w: textWidth(meetingClock().length > 5 ? '00:00:00' : '00:00') + (hovering ? 62 : 38),
        h: 24, gap: OPEN_GAP, body: ACTIVE_BODY, meeting: 1, mstop: hovering ? 1 : 0,
      });
      else if (hovering) Object.assign(t, { w: ICONS_W, h: OPEN_H, gap: OPEN_GAP, body: OPEN_BODY, icons: 1 });
      break;
    case 'listen':
      Object.assign(t, active);
      if (notice) Object.assign(t, { w: labelWidth(noticeLabel, 32), text: 1, label: noticeLabel,
        labelColor: noticeLabel === QUIET_NOTICE ? null : AMBER, quiet: noticeLabel === QUIET_NOTICE });
      else Object.assign(t, { w: locked ? LOCKED_W : LISTEN_W, meter: 1, work: 0, span: LISTEN_SPAN, controls: locked ? 1 : 0 });
      break;
    case 'processing':
      Object.assign(t, active, { w: WORKING_W, meter: 1, work: 1, span: WORKING_SPAN });
      break;
    case 'success':
      Object.assign(t, active, { w: ROUND_W, check: 1 });
      break;
    case 'saved':
      Object.assign(t, active, { w: labelWidth(message, 54), check: 1, text: 1, label: message });
      break;
    case 'error':
      Object.assign(t, active, { w: labelWidth(message, 32), text: 1, label: message, labelColor: calmError ? null : ERROR_TEXT });
      break;
  }
  // Words need more glass behind them than a line or an icon does.
  if (t.text || t.offer || t.meeting) t.body = TEXT_BODY;
  // On a side dock the voice line stands upright along the screen edge.
  if (sideDock() && t.meter && !t.controls) [t.w, t.h] = [t.h, t.w];
  // While dragged, the pill is just a ball under the cursor, at the point it
  // was grabbed.
  if (dragging) {
    Object.assign(t, { w: BALL, h: BALL, alpha: 1, rise: 0, body: ACTIVE_BODY, meter: 0, check: 0,
      text: 0, controls: 0, offer: 0, meeting: 0, mstop: 0, icons: 0 });
    const home = dockCenter(BALL, BALL, t.gap);
    t.dx = grab.x - home.x; t.dy = grab.y - home.y;
  }
  if (dockLeaving) t.alpha = 0;
  t.w = Math.min(t.w, MAX_W);
  t.h = Math.min(t.h, Math.max(3, innerHeight - 8));
  return t;
}

// --- Hit area -----------------------------------------------------------------
// The clickable rectangles, from the layout targets (not the animated values),
// so they don't wobble while the pill changes shape. The resting pill is a
// thin line right at the screen edge, where scrollbars and window borders
// live, so it is never clickable itself: a catch area a little further in
// opens it instead. While the pill is open, the catch area stays included so
// a cursor near the edge can't flicker between the two.

const CATCH_ALONG = 64, EDGE_CLEAR = 16, CATCH_DEPTH = 28;
let lastHitKey = '';

function restCatchArea() {
  const c = dockCenter(0, 0, 0);
  if (dock === 'middle-left') return { x: EDGE_CLEAR, y: c.y - CATCH_ALONG / 2, w: CATCH_DEPTH, h: CATCH_ALONG };
  if (dock === 'middle-right') return { x: innerWidth - EDGE_CLEAR - CATCH_DEPTH, y: c.y - CATCH_ALONG / 2, w: CATCH_DEPTH, h: CATCH_ALONG };
  return { x: c.x - CATCH_ALONG / 2, y: innerHeight - EDGE_CLEAR - CATCH_DEPTH, w: CATCH_ALONG, h: CATCH_DEPTH };
}

// The pill has something to click beyond its catch area.
const opened = (t) => mode !== 'rest' || t.icons || t.offer || t.meeting || dragging;

function reportHitRect(t) {
  const rects = [];
  if (t.alpha > 0) {
    if (opened(t)) {
      const c = dockCenter(t.w, t.h, t.gap);
      rects.push({ x: c.x - t.w / 2 - 6, y: c.y - t.h / 2 - 6, w: t.w + 12, h: t.h + 12 });
    }
    if (mode === 'rest') rects.push(restCatchArea());
  }
  const rounded = rects.map((r) => ({ x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) }));
  const key = rounded.map((r) => `${r.x},${r.y},${r.w},${r.h}`).join(';');
  if (key !== lastHitKey) {
    lastHitKey = key;
    window.bridge.setHitRect(rounded.length ? rounded : null);
  }
}

// Which control is under the cursor: the question, the meeting chip, one of
// the three icons, or the hands-free stop/cancel buttons. Hidden controls are
// never hit.
function findHoverTarget(t) {
  if (!pointerInside || !mouse) return null;
  const c = dockCenter(t.w, t.h, t.gap), right = c.x + t.w / 2;
  if (mode === 'rest' && offerVisible()) return 'offer';
  if (mode === 'rest' && meetingVisible()) {
    return S.mstop.x > 0.5 && mouse.x > right - 28 ? 'meetingStop' : 'meeting';
  }
  if (mode === 'rest' && restVisible()) {
    if (S.icons.x < 0.5) return 'pill';
    const left = c.x - t.w / 2;
    let nearest = 'pill', best = Infinity;
    for (const [id, offset] of ICON_SLOTS) {
      const d = Math.abs(mouse.x - (left + offset));
      if (d < best) { best = d; nearest = id; }
    }
    return nearest;
  }
  if (mode === 'listen' && locked && !t.notice) {
    const on = (x) => Math.hypot(mouse.x - x, mouse.y - c.y) <= 14;
    if (on(c.x - t.w / 2 + CONTROL_INSET)) return 'cancel';
    if (on(right - CONTROL_INSET)) return 'stop';
  }
  return mode !== 'rest' ? 'body' : null;
}

// Semantic controls give assistive technology the same status and action
// names. The DOM is only touched when something actually changed: this runs
// every frame.
const actionNames = { pill: 'Start dictation', handsfree: 'Hands-free dictation', meetingStart: 'Start meeting', stop: 'Stop dictation',
  cancel: 'Cancel dictation', meeting: 'Open meeting', meetingStop: 'Stop meeting', hub: 'Open Syllune', body: 'Drag to move' };
let semanticKey = '', shownTitle = null, shownCursor = '';
function updateAccessibility(t) {
  const status = mode === 'rest' ? (offerVisible() ? offer.label : meetingVisible() ? `Meeting recording, ${meetingClock()}` : 'Ready to dictate')
    : mode === 'listen' ? (t.notice ? t.label : locked ? 'Hands-free dictation recording' : 'Dictation recording')
    : mode === 'processing' ? 'Preparing dictation' : mode === 'error' || mode === 'saved' ? message : 'Dictation inserted';
  const labels = mode === 'rest' ? (offerVisible() ? ['offer'] : meetingVisible() ? ['meeting', 'meetingStop'] : ['handsfree', 'meetingStart', 'hub'])
    : mode === 'listen' && locked && !t.notice ? ['cancel', 'stop'] : [];
  const nameOf = (id) => id === 'offer' ? offerLabel : actionNames[id];
  const key = `${status}|${labels.join(',')}`;
  if (key !== semanticKey) {
    semanticKey = key;
    document.getElementById('status').textContent = status;
    canvas.setAttribute('aria-label', status);
    const actions = document.getElementById('actions');
    actions.replaceChildren(...labels.map(id => {
      const button = document.createElement('button');
      button.textContent = nameOf(id); button.setAttribute('aria-label', nameOf(id));
      button.addEventListener('click', () => window.bridge.pillAction(ACTIONS[id]));
      return button;
    }));
  }
  // The tooltip names the icon under the cursor; text on the pill needs none.
  const title = hoverTarget && hoverTarget !== 'body' && hoverTarget !== 'offer' && S.icons.x + S.controls.x + S.meeting.x > 0.5
    ? actionNames[hoverTarget] : '';
  if (title !== shownTitle) { shownTitle = title; canvas.title = title; }
  const cursor = dragging ? 'grabbing' : hoverTarget ? 'pointer' : 'default';
  if (cursor !== shownCursor) { shownCursor = cursor; canvas.style.cursor = cursor; }
}

// --- Drawing ------------------------------------------------------------------

let dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lastHitKey = '';
  wake();
}
// Moving to a monitor with another scale changes the pixel ratio without a resize.
function watchPixelRatio() {
  matchMedia(`(resolution: ${dpr}dppx)`).addEventListener('change', () => { resize(); watchPixelRatio(); }, { once: true });
}
addEventListener('resize', resize);

function draw(now, t) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const alpha = clamp(S.alpha.x);
  if (alpha < 0.004) return;

  const w = Math.max(2, S.w.x), h = Math.max(2, S.h.x);
  const thickness = Math.min(w, h), r = thickness / 2;
  const center = drawnCenter(), edge = towardEdge();
  const cx = center.x + edge.x * S.rise.x + S.shake.x;
  const cy = center.y + edge.y * S.rise.x;
  const x = cx - w / 2, y = cy - h / 2;

  ctx.save();
  ctx.globalAlpha = alpha;
  const scale = S.press.x;
  ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);

  drawBody(x, y, w, h, r, thickness);

  // Each layer shows only while it physically fits the pill as it is this
  // frame, so nothing is ever clipped by, or drawn over, a morphing neighbour.
  const vertical = h > w + 1, length = Math.max(w, h);
  const meterOpacity = centerOpacity('meter') * clamp((length - S.span.x - 10) / 10) * clamp((thickness - 14) / 8);
  const controlsOpacity = clamp(S.controls.x) * clamp((w - S.span.x - 52) / 14);
  const checkOpacity = centerOpacity('check') * clamp((thickness - 16) / 8);

  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  drawVoiceLine(cx, cy, thickness, vertical, now, meterOpacity);
  drawControls(x, w, cy, controlsOpacity);
  drawContent(cx, cy, w, now, t, checkOpacity);
  drawOffer(cx, cy, w, h);
  drawMeeting(cx, cy, w, thickness);
  drawIcons(cx - w / 2, cy, w, centerOpacity('icons'));
  ctx.restore();

  ctx.restore();
}

// Smoked glass: a body that lets the desktop through, lighter at the top,
// with a band of light across its upper half and a hairline rim. All of it
// fades with the pill's size, and the glass thins to a plain grey, so the
// tucked sliver is a faint line and not a tiny framed object.
function drawBody(x, y, w, h, r, thickness) {
  const size = clamp((thickness - SLIVER.h) / (ACTIVE_H - SLIVER.h));
  const body = clamp(S.body.x);
  const outline = () => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

  ctx.save();
  ctx.shadowColor = `rgba(0,0,0,${0.1 + 0.2 * size})`;
  ctx.shadowBlur = 3 + 13 * size;
  ctx.shadowOffsetY = 1 + 4 * size;
  const glass = ctx.createLinearGradient(0, y, 0, y + h);
  glass.addColorStop(0, rgba(mixColor(HANDLE_TINT, GLASS_TOP, size), body));
  glass.addColorStop(1, rgba(mixColor(HANDLE_TINT, GLASS_BOTTOM, size), body));
  ctx.fillStyle = glass;
  outline(); ctx.fill();
  ctx.restore();

  const sheen = ctx.createLinearGradient(0, y, 0, y + h * 0.62);
  sheen.addColorStop(0, `rgba(255,255,255,${0.11 * size})`);
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  outline(); ctx.fill();

  const rim = ctx.createLinearGradient(0, y, 0, y + h);
  rim.addColorStop(0, `rgba(255,255,255,${0.08 + 0.24 * size})`);
  rim.addColorStop(1, `rgba(255,255,255,${0.03 + 0.07 * size})`);
  ctx.strokeStyle = rim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, Math.max(0, r - 0.5)); ctx.stroke();
}

// One thin line along the pill. While you talk it moves with your voice and
// lies flat when you don't; while the text is prepared it is a flat line with
// a glint travelling along it. Its ends fade out so it never looks cut off.
function drawVoiceLine(cx, cy, thickness, vertical, now, opacity) {
  if (opacity < 0.01) return;
  const half = S.span.x / 2, reach = Math.max(0, thickness / 2 - 6);
  const work = clamp(S.work.x);
  const energy = WAVES.map((_, k) => (voice.shown[2 * k] + voice.shown[2 * k + 1]) / 2);
  const point = (along, offset) => vertical ? [cx + offset, cy + along] : [cx + along, cy - offset];

  ctx.beginPath();
  for (let i = 0; i <= LINE_POINTS; i++) {
    const u = i / LINE_POINTS * 2 - 1;                    // -1 at one end, 1 at the other
    const taper = Math.cos(u * Math.PI / 2) ** 2;         // pinned flat at both ends
    let sum = 0;
    WAVES.forEach((wave, k) => { sum += wave.weight * energy[k] * Math.sin(u * Math.PI * wave.cycles + voice.phase[k]); });
    const offset = clamp(sum * 2.2, -1, 1) * taper * reach * (1 - work);
    const [px, py] = point(u * half, offset);
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }

  // Brightness along the line: full in the middle and soft at the ends while
  // listening; dim with one bright spot passing through while working.
  const color = mixColor(INK, VIOLET, clamp(S.note.x));
  const glint = ((now - workSince) / GLINT_MS % 1) * 1.7 - 0.35;
  const [x0, y0] = point(-half, 0), [x1, y1] = point(half, 0);
  const shade = ctx.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i <= 8; i++) {
    const at = i / 8;
    const listening = 0.3 + 0.65 * Math.sin(at * Math.PI) ** 0.6;
    const working = reducedMotion.matches ? 0.6 : 0.26 + 0.74 * Math.exp(-(((at - glint) / 0.22) ** 2));
    shade.addColorStop(at, rgba(color, opacity * (listening + (working - listening) * work)));
  }
  ctx.strokeStyle = shade;
  ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke();
}

// Hands-free controls: cancel on the left, stop on the right.
function drawControls(x, w, cy, opacity) {
  if (opacity < 0.01) return;
  const cancelX = x + CONTROL_INSET, stopX = x + w - CONTROL_INSET;
  for (const [id, px] of [['cancel', cancelX], ['stop', stopX]]) {
    if (hoverTarget !== id) continue;
    ctx.fillStyle = `rgba(255,255,255,${(pressedOn === id ? 0.2 : 0.12) * opacity})`;
    ctx.beginPath(); ctx.arc(px, cy, 10, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = rgba(INK, 0.66 * opacity);
  ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cancelX - 3.2, cy - 3.2); ctx.lineTo(cancelX + 3.2, cy + 3.2);
  ctx.moveTo(cancelX + 3.2, cy - 3.2); ctx.lineTo(cancelX - 3.2, cy + 3.2);
  ctx.stroke();
  ctx.fillStyle = rgba(STOP_RED, 0.95 * opacity);
  ctx.beginPath(); ctx.roundRect(stopX - 3.5, cy - 3.5, 7, 7, 2); ctx.fill();
}

// The hovered resting pill: hands-free dictation, start a meeting and the
// menu. The icons appear once the pill is wide enough to hold them.
function drawIcons(left, cy, w, opacity) {
  opacity *= clamp((w - ICONS_W + 22) / 22);
  if (opacity < 0.01) return;
  for (const [id, offset] of ICON_SLOTS) {
    const x = left + offset;
    if (hoverTarget === id) {
      ctx.fillStyle = `rgba(255,255,255,${(pressedOn === id ? 0.18 : 0.1) * opacity})`;
      ctx.beginPath(); ctx.arc(x, cy, 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = rgba(INK, (hoverTarget === id ? 0.96 : 0.74) * opacity);
    ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath();
    if (id === 'handsfree') {
      ctx.roundRect(x - 2.5, cy - 6, 5, 8, 2.5);
      ctx.moveTo(x - 5, cy - 0.5); ctx.arc(x, cy - 0.5, 5, Math.PI, 0, true);
      ctx.moveTo(x, cy + 4.5); ctx.lineTo(x, cy + 6.5);
      ctx.stroke();
    } else if (id === 'meetingStart') {
      ctx.arc(x, cy, 5.5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgba(STOP_RED, 0.9 * opacity);
      ctx.beginPath(); ctx.arc(x, cy, 2.4, 0, Math.PI * 2); ctx.fill();
    } else {
      for (const dy of [-3.5, 0, 3.5]) { ctx.moveTo(x - 4, cy + dy); ctx.lineTo(x + 4, cy + dy); }
      ctx.stroke();
    }
  }
}

// The question the pill is asking. The whole pill is the answer "yes", so it
// lifts a little under the cursor like a button.
function drawOffer(cx, cy, w, h) {
  const opacity = centerOpacity('offer') * fit(w, labelWidth(offerLabel, 30));
  if (opacity < 0.01) return;
  if (hoverTarget === 'offer') {
    ctx.fillStyle = `rgba(255,255,255,${(pressedOn === 'offer' ? 0.14 : 0.07) * opacity})`;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
  }
  drawText(offerLabel, cx, cy, opacity, 'center', null);
}

// Checkmark and message text.
function drawContent(cx, cy, w, now, t, checkOpacity) {
  const textOpacity = centerOpacity('text');
  const accent = mode === 'saved' ? messageAccent : noteMode ? VIOLET : GREEN;

  const label = t.label || (mode === 'saved' ? message : '');
  if (checkOpacity > 0.01 && label) {
    const startX = cx - (textWidth(label) + 22) / 2;
    drawCheck(startX + 6, cy, checkOpacity, accent, now);
    drawText(label, startX + 22, cy, textOpacity * fit(w, labelWidth(label, 54)), 'left', null);
  } else {
    drawCheck(cx, cy, checkOpacity, accent, now);
    if (label) drawText(label, cx, cy, (t.quiet ? 0.62 : 1) * textOpacity * fit(w, labelWidth(label, 32)), 'center', t.labelColor);
  }
}

// Text fades in only once the pill is wide enough to hold it, so it never
// appears clipped while the pill is still growing.
function fit(width, needed) { return clamp((width - (needed - 16)) / 16); }

function drawCheck(x, cy, opacity, color, now) {
  const progress = easeOut(clamp((now - checkSince) / CHECK_DRAW_MS));
  if (opacity < 0.01 || progress < 0.02) return;   // a zero-length dash would draw a dot
  const pts = [[x - 4.7, cy + 0.4], [x - 1.3, cy + 3.8], [x + 5.1, cy - 3.8]];
  const total = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1])
              + Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2;
  ctx.strokeStyle = rgba(color, opacity);
  ctx.setLineDash([total * progress, total]);
  ctx.beginPath();
  ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.lineTo(...pts[2]);
  ctx.stroke();
  ctx.restore();
}

function drawText(label, x, cy, opacity, align, color) {
  if (opacity < 0.01 || !label) return;
  ctx.font = FONT;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(color || INK, (color ? 1 : 0.92) * opacity);
  ctx.fillText(label, x, cy + 0.5);
}

// A quiet recording indicator. Only the hover stop button changes its width.
function drawMeeting(cx, cy, w, thickness) {
  const opacity = centerOpacity('meeting') * clamp((thickness - 12) / 10);
  if (opacity < 0.01 || meetingSince === null) return;
  const left = cx - w / 2 + 13;
  ctx.fillStyle = rgba(STOP_RED, opacity);
  ctx.beginPath(); ctx.arc(left, cy, 3, 0, Math.PI * 2); ctx.fill();
  drawText(meetingClock(), left + 11, cy, opacity, 'left');
  const stop = clamp(S.mstop.x) * opacity;
  if (stop > 0.01) {
    ctx.fillStyle = rgba(STOP_RED, stop);
    ctx.beginPath(); ctx.roundRect(cx + w / 2 - 19, cy - 3.5, 7, 7, 2); ctx.fill();
  }
}

// --- Frame loop ---------------------------------------------------------------
// Runs only while something is moving, in step with the display at whatever
// refresh rate it has. Integration uses small fixed steps so springs behave
// the same at 60 or 240 Hz and a dropped frame never jumps.

let running = false, lastFrame = 0, settledReported = null;
const FRAME_FALLBACK_MS = 120;

function reportSettled(settled) {
  if (settled === settledReported) return;
  settledReported = settled;
  window.bridge.setSettled(settled);
}

function wake() {
  reportSettled(false);
  if (running) return;
  running = true;
  lastFrame = performance.now();
  nextFrame();
}

// The browser can stop delivering animation frames when it believes the
// window is covered or hidden. A recording must never leave the pill frozen
// in its resting shape, so a timer steps in whenever a frame is overdue.
function nextFrame() {
  let done = false;
  const run = (stamp) => {
    if (done) return;
    done = true;
    cancelAnimationFrame(request); clearTimeout(fallback);
    frame(typeof stamp === 'number' ? stamp : performance.now());
  };
  const request = requestAnimationFrame(run);
  const fallback = setTimeout(run, FRAME_FALLBACK_MS);
}

function frame(now) {
  const dt = clamp((now - lastFrame) / 1000, 0, 1 / 30);
  lastFrame = now;

  const t = layout(now);
  S.w.target = t.w; S.h.target = t.h; S.gap.target = t.gap; S.alpha.target = t.alpha; S.body.target = t.body;
  S.dx.target = t.dx; S.dy.target = t.dy;
  S.rise.target = reducedMotion.matches ? 0 : t.rise;
  S.span.target = t.span; S.work.target = t.work;
  S.meter.target = t.meter; S.check.target = t.check; S.text.target = t.text;
  S.controls.target = t.controls; S.offer.target = t.offer;
  S.meeting.target = t.meeting; S.mstop.target = t.mstop; S.icons.target = t.icons;
  S.note.target = noteMode ? 1 : 0;
  // Leaving a dock, the pill sinks into the spot it was dropped on.
  S.press.target = dockLeaving && !reducedMotion.matches ? 0.9 : pressedOn === 'pill' || pressedOn === 'offer' ? 0.96 : 1;
  S.alpha.configure(dockLeaving ? ALPHA_LEAVE_S : ALPHA_S);
  timeLayers();
  hoverTarget = findHoverTarget(t);
  updateAccessibility(t);

  const springs = Object.values(S);
  for (let done = 0; done < dt; done += 1 / 480) {
    const step = Math.min(1 / 480, dt - done);
    for (const s of springs) s.step(step);
  }
  updateVoice(dt);
  draw(now, t);
  reportHitRect(t);

  if (dockLeaving && !dockLeftSent && S.alpha.x < 0.01) {
    dockLeftSent = true;
    window.bridge.dockLeft();
  }

  const moving = mode !== 'rest' || pressedOn || springs.some((s) => !s.resting)
              || voice.shown.some((v) => v > 0.001) || (dockLeaving && !dockLeftSent);
  if (moving) {
    nextFrame();
  } else {
    running = false;
    reportSettled(S.alpha.x < 0.004);
    // Redraw on the next displayed second, leaving the GPU idle in between.
    clearTimeout(meetingTick);
    if (meetingVisible()) meetingTick = setTimeout(wake, 1010 - ((Date.now() - meetingSince) % 1000));
  }
}

resize();
watchPixelRatio();
touch();
</script>
</body>
</html>
