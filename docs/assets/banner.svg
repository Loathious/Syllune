<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <title>Syllune</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1E304A"/><stop offset="1" stop-color="#0E1523"/></linearGradient>
    <linearGradient id="ink" x2="0.8" y2="1"><stop stop-color="#243B5A"/><stop offset="1" stop-color="#101929"/></linearGradient>
    <linearGradient id="silver" x2="0.3" y2="1"><stop stop-color="#F0F5FB"/><stop offset="1" stop-color="#AAC2DF"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- The app mark, scaled from overlay/assets/syllune.svg -->
  <g transform="translate(120 56) scale(0.203)">
    <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#ink)"/>
    <rect x="33" y="33" width="958" height="958" rx="223" fill="none" stroke="#86ACD8" stroke-opacity=".35" stroke-width="4"/>
    <g fill="url(#silver)">
      <rect x="244" y="472" width="68" height="200" rx="34"/>
      <rect x="361" y="342" width="68" height="360" rx="34"/>
      <rect x="478" y="282" width="68" height="460" rx="34"/>
      <rect x="595" y="322" width="68" height="360" rx="34"/>
      <rect x="712" y="352" width="68" height="200" rx="34"/>
    </g>
  </g>
  <text x="376" y="168" fill="#F0F5FB" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="600" letter-spacing="-1">Syllune</text>
  <text x="380" y="222" fill="#AAC2DF" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30">Private, local dictation for Windows</text>
</svg>
